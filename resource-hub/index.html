<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Resource Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Developer Resource Hub</h1>
    <p>Find tools, sites and tutorials for developers.</p>
    <button id="themeToggle">Dark mode</button>
  </header>

  <main>
    <section class="form-box">
      <h2>Add a resource</h2>
      <form id="addForm">
        <input type="text" id="newTitle" placeholder="Title" required>

        <select id="newCategory" required>
          <option value="">Choose a category</option>
          <option value="Web Dev">Web Dev</option>
          <option value="App Dev">App Dev</option>
          <option value="AI/ML">AI/ML</option>
          <option value="Tools">Tools</option>
        </select>

        <input type="text" id="newDescription" placeholder="Short description" required>
        <input type="text" id="newLink" placeholder="Link (starts with https://)" required>

        <button type="submit">Add Resource</button>
      </form>
    </section>

    <input type="text" id="searchInput" placeholder="Search resources...">

    <select id="categorySelect">
      <option value="All">All categories</option>
      <option value="Web Dev">Web Dev</option>
      <option value="App Dev">App Dev</option>
      <option value="AI/ML">AI/ML</option>
      <option value="Tools">Tools</option>
    </select>

    <div id="resourceList"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
